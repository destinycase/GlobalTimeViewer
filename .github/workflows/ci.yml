name: GTV Quality & Package CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Quality Verification
    # 실행 환경을 고정한다. 러너 이미지가 바뀌어 검사 결과가 흔들리지 않게 한다.
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check module dependency inventory
        run: npm run docs:module-inventory:check

      # 커버리지 실행이 단위·통합 검사 전체를 포함하므로 검사를 따로 반복하지 않는다.
      - name: Unit & integration tests with coverage
        run: npm run test:coverage

  package-verification:
    name: Build & Package Integrity Verification
    needs: quality
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 앞 작업에서 같은 소스의 전체 검사가 통과했으므로 패키징의 사전 검사는 건너뛴다.
      # 패키징은 검증 목적이며, 만든 ZIP을 GitHub 결과물(artifact)이나 Release로 올리지 않는다.
      - name: Verify package pipeline
        run: npm run package
        env:
          GTV_SKIP_PRETEST: '1'
